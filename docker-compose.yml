services:
  palmer-lou:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    ports:
      - "8787:8787"
    env_file:
      - ./infrastructure/docker/backend.env
    environment:
      - PORT=${PORT:-8787}
      - PALMER_LOU_REQUIRE_BLUETOOTH_READY=${PALMER_LOU_REQUIRE_BLUETOOTH_READY:-false}
      - DBUS_SYSTEM_BUS_ADDRESS=${DBUS_SYSTEM_BUS_ADDRESS:-unix:path=/run/dbus/system_bus_socket}
    volumes:
      - ./infrastructure/scripts:/app/infrastructure/scripts:ro
    restart: unless-stopped

  palmer-lou-linux-bluetooth:
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
    profiles: ["linux-bt"]
    env_file:
      - ./infrastructure/docker/backend.env
    environment:
      - PORT=${PORT:-8787}
      - PALMER_LOU_REQUIRE_BLUETOOTH_READY=${PALMER_LOU_REQUIRE_BLUETOOTH_READY:-true}
      - DBUS_SYSTEM_BUS_ADDRESS=unix:path=/run/dbus/system_bus_socket
    ports:
      - "8787:8787"
    volumes:
      - ./infrastructure/scripts:/app/infrastructure/scripts:ro
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket
    restart: unless-stopped
